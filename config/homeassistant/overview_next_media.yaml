# Overview home: next calendar / Sonarr / Radarr items
rest:
  - resource_template: >-
      https://sonarr.wongkino.com/api/v3/calendar?start={{ now().date() }}&end={{ (now() + timedelta(days=7)).date() }}&includeSeries=true
    method: GET
    headers:
      X-Api-Key: !secret sonarr_api_key
    scan_interval: 1800
    sensor:
      - name: "下一集"
        unique_id: overview_next_sonarr_rest
        icon: mdi:television-classic
        json_attributes_path: "$[0]"
        json_attributes:
          - airDate
          - airDateUtc
          - title
          - seasonNumber
          - episodeNumber
        value_template: >-
          {% if value_json is sequence and value_json|length > 0 %}
            {% set item = value_json[0] %}
            {% set series = item.series.title if item.series is defined else item.title %}
            {% set ep = 'S' ~ '%02d'|format(item.seasonNumber) ~ 'E' ~ '%02d'|format(item.episodeNumber) %}
            {% set day = item.airDate[5:10] | replace('-', '/') if item.airDate is defined and item.airDate else '' %}
            {{ series }} · {{ ep }}{% if day %}（{{ day }}）{% endif %}
          {% else %}暫無{% endif %}

  - resource_template: >-
      https://radarr.wongkino.com/api/v3/calendar?start={{ now().date() }}&end={{ (now() + timedelta(days=21)).date() }}&includeMovie=true
    method: GET
    headers:
      X-Api-Key: !secret radarr_api_key
    scan_interval: 1800
    sensor:
      - name: "下一部電影"
        unique_id: overview_next_radarr_rest
        icon: mdi:movie-open
        json_attributes_path: "$[0]"
        json_attributes:
          - title
          - digitalRelease
          - physicalRelease
          - inCinemas
        value_template: >-
          {% if value_json is sequence and value_json|length > 0 %}
            {% set item = value_json[0] %}
            {% set raw = item.digitalRelease | default(item.physicalRelease | default(item.inCinemas | default(''), true), true) %}
            {% set day = raw[5:10] | replace('-', '/') if raw else '' %}
            {{ item.title }}{% if day %}（{{ day }}）{% endif %}
          {% else %}暫無{% endif %}

template:
  - sensor:
      - name: "下一活動"
        unique_id: overview_next_couple_event
        icon: mdi:calendar-heart
        state: >-
          {% set msg = state_attr('calendar.qing_lu_xing_shi_li', 'message') %}
          {% set start = state_attr('calendar.qing_lu_xing_shi_li', 'start_time') %}
          {% if msg and start %}
            {{ msg }}（{{ as_timestamp(start) | timestamp_custom('%m/%d', true) }}）
          {% elif msg %}
            {{ msg }}
          {% else %}
            暫無
          {% endif %}
        attributes:
          start_time: "{{ state_attr('calendar.qing_lu_xing_shi_li', 'start_time') }}"
          end_time: "{{ state_attr('calendar.qing_lu_xing_shi_li', 'end_time') }}"
          title: "{{ state_attr('calendar.qing_lu_xing_shi_li', 'message') }}"
