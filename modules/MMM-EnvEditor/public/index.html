<!DOCTYPE html>
<html lang="zh-Hant">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>MagicMirror · Admin</title>
	<link rel="stylesheet" href="style.css" />
</head>
<body>
	<section id="gate" class="gate wrap">
		<header class="hero">
			<p class="eyebrow">MagicMirror</p>
			<h1 id="gate-title">管理員登入</h1>
			<p id="gate-lede" class="lede">輸入密碼以編輯 <code>config.env</code>。</p>
		</header>
		<p id="gate-status" class="status" hidden></p>
		<form id="gate-form" class="gate-form">
			<label for="gate-password">密碼</label>
			<input id="gate-password" type="password" autocomplete="current-password" required minlength="4" />
			<button type="submit" class="btn primary" id="gate-submit">進入</button>
		</form>
	</section>

	<main id="editor" class="wrap" hidden>
		<header class="hero">
			<p class="eyebrow">MagicMirror</p>
			<h1>環境設定</h1>
			<p class="lede">編輯 <code>config/config.env</code>。儲存後需重啟才會套用。</p>
		</header>

		<p id="status" class="status" hidden></p>

		<form id="env-form" class="form"></form>

		<section class="group password-box">
			<h2>管理密碼</h2>
			<p class="lede">密碼以雜湊儲存，不會出現在環境變數表單中。</p>
			<div class="field">
				<label for="pw-current">目前密碼</label>
				<input id="pw-current" type="password" autocomplete="current-password" />
			</div>
			<div class="field">
				<label for="pw-new">新密碼</label>
				<input id="pw-new" type="password" autocomplete="new-password" minlength="4" />
			</div>
			<div class="field">
				<label for="pw-confirm">確認新密碼</label>
				<input id="pw-confirm" type="password" autocomplete="new-password" minlength="4" />
			</div>
			<p id="pw-status" class="status" hidden></p>
			<button type="button" id="btn-password" class="btn">變更密碼</button>
		</section>

		<footer class="actions">
			<button type="button" id="btn-save" class="btn primary">儲存</button>
			<button type="button" id="btn-reload" class="btn">重新載入</button>
			<button type="button" id="btn-restart" class="btn danger">儲存並重啟 MM</button>
			<button type="button" id="btn-logout" class="btn">登出</button>
		</footer>
	</main>
	<script src="app.js"></script>
</body>
</html>
