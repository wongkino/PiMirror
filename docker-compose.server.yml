# API only — no display/GPIO
services:
  pimirror:
    image: ${PIMIRROR_IMAGE:-pimirror:latest}
    build: .
    container_name: pimirror-server
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-8090}:8090"
    environment:
      RUN_MODE: server
      DASHBOARD_PORT: ${DASHBOARD_PORT:-8090}
      HKO_STATION: ${HKO_STATION:-元朗公園}
      CALENDAR_URL: ${CALENDAR_URL:-}
      CALENDAR_NAME: ${CALENDAR_NAME:-行事曆}
      CALENDAR_COLOR: ${CALENDAR_COLOR:-#0a84ff}
      HOLIDAYS_ICS_URL: ${HOLIDAYS_ICS_URL:-https://www.1823.gov.hk/common/ical/tc.ics}
      HA_URL: ${HA_URL:-http://10.0.0.2:8123}
      HA_HOST: ${HA_HOST:-10.0.0.2}
      HA_PORT: ${HA_PORT:-8123}
      HA_TOKEN: ${HA_TOKEN:-}
