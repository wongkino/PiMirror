# PiMirror — kiosk on Raspberry Pi (Wayland + GPIO from host).
#
#   cp .env.example .env
#   docker compose up -d

services:
  pimirror:
    image: ${PIMIRROR_IMAGE:-pimirror:latest}
    build: .
    container_name: pimirror
    restart: unless-stopped
    network_mode: host
    environment:
      RUN_MODE: kiosk
      DASHBOARD_PORT: ${DASHBOARD_PORT:-8090}
      HKO_STATION: ${HKO_STATION:-元朗公園}
      CALENDAR_URL: ${CALENDAR_URL:-}
      CALENDAR_NAME: ${CALENDAR_NAME:-行事曆}
      CALENDAR_COLOR: ${CALENDAR_COLOR:-#0a84ff}
      HOLIDAYS_ICS_URL: ${HOLIDAYS_ICS_URL:-https://www.1823.gov.hk/common/ical/tc.ics}
      HA_URL: ${HA_URL:-http://10.0.0.2:8123}
      HA_HOST: ${HA_HOST:-10.0.0.2}
      HA_PORT: ${HA_PORT:-8123}
      HA_TOKEN: ${HA_TOKEN:-}
      WAYLAND_DISPLAY: ${WAYLAND_DISPLAY:-wayland-0}
      XDG_RUNTIME_DIR: ${XDG_RUNTIME_DIR:-/run/user/1000}
      DISPLAY: ${DISPLAY:-:0}
    volumes:
      - ${XDG_RUNTIME_DIR:-/run/user/1000}:${XDG_RUNTIME_DIR:-/run/user/1000}
    devices:
      - /dev/dri:/dev/dri
      - /dev/gpiomem:/dev/gpiomem
    user: "${UID:-1000}:${GID:-1000}"
    # 若 DHT/GPU 權限不足，確認 host 使用者已在 gpio、video、render 群組
    #   sudo usermod -aG gpio,video,render $USER
